name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Run unit tests
        run: npx vitest run
      - name: Build
        run: npm run build

  llm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm_service/pyproject.toml
      - name: Install dependencies
        working-directory: llm_service
        run: python -m pip install -e ".[dev]"
      - name: Run agent tests
        working-directory: llm_service
        run: python -m pytest -q
      - name: Run lint
        working-directory: llm_service
        run: python -m ruff check app tests evaluation

  rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: RAG/requirements-dev.txt
      - name: Install dependencies
        working-directory: RAG
        run: python -m pip install -r requirements-dev.txt
      - name: Run RAG tests
        working-directory: RAG
        run: python -m pytest -q

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ednova
          POSTGRES_PASSWORD: ednova
          POSTGRES_DB: ednova_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ednova -d ednova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/pyproject.toml
      - name: Install dependencies
        working-directory: Backend
        run: python -m pip install -e ".[dev]"
      - name: Run backend migrations and tests
        working-directory: Backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ednova:ednova@127.0.0.1:55432/ednova_test
        run: |
          python -m pytest -q
          python -m ruff check src tests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build service images
        run: docker compose build
