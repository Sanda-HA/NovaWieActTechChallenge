name: ednova

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ednova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ednova}
      POSTGRES_DB: ${POSTGRES_DB:-ednova}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rag:
    build:
      context: ./RAG
    environment:
      EMBED_BACKEND: local
      INDEX_DIR: /app/index
    volumes:
      - rag_index:/app/index
    ports:
      - "${RAG_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30

  llm:
    build:
      context: ./llm_service
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-https://llm.felcloud.io/v1}
      LLM_API_KEY: ${LLM_API_KEY:-replace-with-an-api-key}
      COMPACT_MODEL: ${COMPACT_MODEL:-qwen2.5-3b}
      MID_SIZE_MODEL: ${MID_SIZE_MODEL:-qwen2.5-coder-7b}
      RAG_URL: http://rag:8001
      CACHE_PATH: /data/ednova_cache.sqlite3
      LEARNER_DB_PATH: /data/ednova_learners.sqlite3
      REQUEST_LOG_PATH: /data/requests.jsonl
      REDIS_URL: redis://redis:6379/0
      ROOM_TUTOR_PERMIT_URL: http://backend:9999/internal/room-tutor/permit
    volumes:
      - agent_data:/data
    ports:
      - "${LLM_PORT:-8100}:8100"
    depends_on:
      rag:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./Backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ednova}:${POSTGRES_PASSWORD:-ednova}@postgres:5432/${POSTGRES_DB:-ednova}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      AGENT_URL: http://llm:8100
    ports:
      - "${BACKEND_PORT:-9999}:9999"
    depends_on:
      postgres:
        condition: service_healthy
      llm:
        condition: service_started

  web:
    build:
      context: ./web
    environment:
      EDNOVA_BACKEND_HOST: backend
      EDNOVA_BACKEND_PORT: 9999
    ports:
      - "${WEB_PORT:-4175}:4175"
    depends_on:
      - backend

volumes:
  postgres_data:
  rag_index:
  agent_data:
  redis_data:
