[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sarrabenzarti", email = "benzarti.sarra2@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "sqlalchemy==2.0.41",
    "alembic==1.16.4",
    "pydantic==2.11.7",
    "pyjwt==2.10.1",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pwdlib[argon2]>=0.3.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.0.0", "ruff==0.12.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures imported from another test module are redefined as same-named test parameters.
"tests/*" = ["F811"]
